<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <rect width="512" height="512" rx="96" fill="#0f2b48"/>
  
  <!-- Topology Links -->
  <line x1="160" y1="180" x2="352" y2="180" stroke="#94a3b8" stroke-width="12" stroke-linecap="round"/>
  <line x1="160" y1="180" x2="256" y2="350" stroke="#94a3b8" stroke-width="12" stroke-linecap="round"/>
  <line x1="352" y1="180" x2="256" y2="350" stroke="#94a3b8" stroke-width="12" stroke-linecap="round"/>
  
  <!-- Animated / Accent Packet indicator -->
  <circle cx="256" cy="180" r="14" fill="#38bdf8" />
  <circle cx="208" cy="265" r="14" fill="#38bdf8" />
  
  <!-- Routers -->
  <!-- Router A -->
  <g transform="translate(160, 180)">
    <circle r="48" fill="#1e3a8a" stroke="#60a5fa" stroke-width="8"/>
    <text text-anchor="middle" dy="12" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="bold" font-size="32">A</text>
  </g>
  
  <!-- Router B -->
  <g transform="translate(352, 180)">
    <circle r="48" fill="#1e3a8a" stroke="#60a5fa" stroke-width="8"/>
    <text text-anchor="middle" dy="12" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="bold" font-size="32">B</text>
  </g>
  
  <!-- Router C -->
  <g transform="translate(256, 350)">
    <circle r="48" fill="#1e3a8a" stroke="#60a5fa" stroke-width="8"/>
    <text text-anchor="middle" dy="12" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="bold" font-size="32">C</text>
  </g>
  
  <!-- Subtitle / Tag -->
  <text x="256" y="445" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-weight="600" font-size="28" letter-spacing="4">DV ROUTING</text>
</svg>
